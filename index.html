<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08090b">
<title>MKT 304 UltraGlance</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">MKT 304 • ULTRAGLANCE</div>
      <h1>Camera Helper</h1>
    </div>
    <button id="cameraToggle" class="small">Camera</button>
  </header>

  <section class="cameraShell">
    <video id="video" autoplay playsinline muted></video>
    <div class="frame"></div>
    <div id="cameraMessage" class="cameraMessage">Starting camera…</div>
  </section>

  <button id="scanBtn" class="scan" disabled>SCAN QUESTION</button>

  <label class="upload">
    Use photo instead
    <input id="photoInput" type="file" accept="image/*" capture="environment">
  </label>

  <div class="legend">
    <span class="a">A</span><span class="b">B</span><span class="c">C</span><span class="d">D</span>
  </div>

  <p class="hint">Front camera mode. Keep the full question and all four choices inside the frame.</p>
</main>

<div id="thinking" class="thinking" hidden>
  <div class="spinner"></div>
</div>

<section id="result" class="result" aria-live="assertive">
  <div id="resultLetter" class="resultLetter">?</div>
  <div id="resultLabel" class="resultLabel">TAP TO CLEAR</div>
</section>

<canvas id="canvas" hidden></canvas>
<script src="/app.js"></script>
</body>
</html>
